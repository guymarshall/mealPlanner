<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <table class="meal-table">
        <tr>
            <th></th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
            <th>Saturday</th>
            <th>Sunday</th>
        </tr>
        <tr>
            <td>Breakfast</td>
            <td id="meal-monday-breakfast"></td>
            <td id="meal-tuesday-breakfast"></td>
            <td id="meal-wednesday-breakfast"></td>
            <td id="meal-thursday-breakfast"></td>
            <td id="meal-friday-breakfast"></td>
            <td id="meal-saturday-breakfast"></td>
            <td id="meal-sunday-breakfast"></td>
        </tr>
        <tr>
            <td>Lunch</td>
            <td id="meal-monday-lunch"></td>
            <td id="meal-tuesday-lunch"></td>
            <td id="meal-wednesday-lunch"></td>
            <td id="meal-thursday-lunch"></td>
            <td id="meal-friday-lunch"></td>
            <td id="meal-saturday-lunch"></td>
            <td id="meal-sunday-lunch"></td>
        </tr>
        <tr>
            <td>Tea</td>
            <td id="meal-monday-tea"></td>
            <td id="meal-tuesday-tea"></td>
            <td id="meal-wednesday-tea"></td>
            <td id="meal-thursday-tea"></td>
            <td id="meal-friday-tea"></td>
            <td id="meal-saturday-tea"></td>
            <td id="meal-sunday-tea"></td>
        </tr>
    </table>
</body>

</html>
